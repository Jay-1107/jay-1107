<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Jay — Full Stack Developer and Web Designer</title>
  <desc id="desc">Animated dark developer banner with flowing blue circuit paths and a clear personal introduction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse"><stop stop-color="#090D12"/><stop offset=".52" stop-color="#0C121A"/><stop offset="1" stop-color="#07111A"/></linearGradient>
    <linearGradient id="electric" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#335A73"/><stop offset=".28" stop-color="#8EC6E8"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset=".72" stop-color="#4AB9F2"/><stop offset="1" stop-color="#294F68"/></linearGradient>
    <linearGradient id="role" x1="80" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#8EC6E8"/><stop offset="1" stop-color="#4A8BB2"/></linearGradient>
    <filter id="glow" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="spark" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="378" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="1" y="1" width="1198" height="378" rx="18" fill="url(#bg)"/>
    <g opacity=".28" stroke="#37627E" stroke-width="1">
      <path d="M0 78H180L225 123H390L445 68H610L670 128H850L915 63H1200"/>
      <path d="M0 320H160L214 266H365L420 321H590L648 263H830L900 333H1200"/>
      <path d="M130 0L245 115M1030 0L912 118M95 380L225 250M1100 380L952 222"/>
    </g>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-40 106H128L182 160H335L397 222H585L646 161H807L870 99H1240" stroke="#285875" stroke-width="2" opacity=".65"/>
      <path d="M-40 123H110L172 185H314L381 252H607L673 186H831L890 127H1240" stroke="#4BA9D8" stroke-width="2" opacity=".8"/>
      <path d="M-40 142H93L160 209H300L370 279H621L692 208H850L916 142H1240" stroke="url(#electric)" stroke-width="3" filter="url(#glow)" stroke-dasharray="170 42">
        <animate attributeName="stroke-dashoffset" values="420;0" dur="6s" repeatCount="indefinite"/>
      </path>
      <path d="M-40 162H78L147 231H282L354 303H638L710 231H869L940 160H1240" stroke="#78C9EF" stroke-width="2" opacity=".58" stroke-dasharray="120 34">
        <animate attributeName="stroke-dashoffset" values="0;-308" dur="7s" repeatCount="indefinite"/>
      </path>
      <path d="M-40 183H61L131 253H263L340 330H655L733 252H888L964 176H1240" stroke="#315D76" stroke-width="2" opacity=".55"/>
    </g>

    <g fill="#DDF4FF" filter="url(#spark)">
      <circle r="3"><animateMotion dur="5.5s" repeatCount="indefinite" path="M-20 142H93L160 209H300L370 279H621L692 208H850L916 142H1240"/></circle>
      <circle r="2.5"><animateMotion begin="-2.4s" dur="7s" repeatCount="indefinite" path="M1240 160H940L869 231H710L638 303H354L282 231H147L78 162H-40"/></circle>
      <circle cx="782" cy="180" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="1042" cy="142" r="2.5"><animate attributeName="opacity" values="1;.15;1" dur="2.3s" repeatCount="indefinite"/></circle>
    </g>

    <rect x="46" y="75" width="560" height="225" rx="14" fill="#080D13" fill-opacity=".82" stroke="#223442"/>
    <path d="M46 75H606" stroke="#76BCE2" stroke-width="2" opacity=".7"/>
    <text x="78" y="125" fill="#718B9B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2">WELCOME TO MY GITHUB</text>
    <text x="76" y="208" fill="#F4F7F9" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="750" letter-spacing="-1">Hi, I'm Jay</text>
    <text x="78" y="260" fill="url(#role)" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="500">Full Stack Developer · Web Designer</text>
    <rect x="79" y="281" width="14" height="3" rx="1.5" fill="#78C9EF"><animate attributeName="width" values="14;58;14" dur="2.8s" repeatCount="indefinite"/></rect>

    <text x="1127" y="344" text-anchor="end" fill="#4F6574" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">JAY-1107  /  GUJARAT, INDIA</text>
  </g>
  <rect x="1" y="1" width="1198" height="378" rx="18" stroke="#2C4555" stroke-width="2"/>
</svg>
